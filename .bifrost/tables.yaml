_anchors:
  policies:
    - &admin_bypass
      name: admin_bypass
      description: Platform admins may maintain Halo Dispatch Portal cache rows.
      actions: [read, create, update, delete]
      when: {user: is_platform_admin}
    - &dispatch_access
      name: halo_dispatch_psa_users
      description: PSA Users may read and refresh Halo Dispatch Portal caches.
      actions: [read, create, update, delete]
      when: {call: has_role, args: ["PSA Users"]}

tables:
  3d20900e-8a79-4960-a1bc-c50c3e6461c3:
    id: 3d20900e-8a79-4960-a1bc-c50c3e6461c3
    name: halo_dispatch_agents
    description: Cached Halo agents; email_lower maps a Bifrost caller to their Halo agent identity.
    schema:
      columns:
        - {name: id, type: int}
        - {name: name, type: string}
        - {name: email, type: string}
        - {name: email_lower, type: string}
        - {name: team, type: string}
        - {name: initials, type: string}
        - {name: jobtitle, type: string}
        - {name: colour, type: string}
        - {name: agentphotopath, type: string}
        - {name: isdisabled, type: bool}
        - {name: isapiagent, type: bool}
    policies: [*admin_bypass, *dispatch_access]

  ad0b8658-9506-4d28-bef9-355c726c8634:
